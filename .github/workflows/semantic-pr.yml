name: "Lint PR"

on:
  pull_request_target:
    branches:
      - development
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            merge
            feat
            chore
            perf
            ci
            ops
            docs
            rollback
            refactor
            test

          scopes: |
            deployment/skaffold
            deployment/cluster

            forma-core
            forma-proc-macro
            forma-schema

            api-gateway
            formatine-operator
            formatine-worker
            integrations-gateway
            mail-server
            monitor-server

            auth-service
            forum-service
            interspace-service
            key-stone-service
            notification-service
            payment-service
            plugin-service

          requireScope: false
          disallowScopes: |
            release
            [A-Z]+
