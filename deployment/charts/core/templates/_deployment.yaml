{{ define "core.deployment" }}
{{ $port := (index .Values "f7r-core" "port") }}
{{ $value := (index .Values "f7r-core" "commonDeployment") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $value.name | quote }}
  namespace: {{ $value.namespace | quote }}
  labels:
    {{- $value.labels | toYaml | nindent 4 }}
spec:
  minReadySeconds: {{ $value.availability.minReadySeconds | default 10 }}
  replicas: {{ $value.replicas }}
  selector:
    matchLabels:
      {{- $value.labels | toYaml | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $value.availability.maxSurge | default "20%" }}
      maxUnavailable: {{ $value.availability.maxUnavailable | default "20%" }}
  template:
    metadata:
      labels:
        {{- $value.labels | toYaml | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: "formatier-ghcr-registry"
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      containers:
        - name: {{ $value.name | quote }}
          image: "{{ $value.image.repository }}:{{ $value.image.tag }}"
          ports:
            - containerPort: {{ $port.serverPort }}
          resources:
            requests:
              cpu: {{ $value.resource.minCpu }}
              memory: {{ $value.resource.minMemory }}
            limits:
              cpu: {{ $value.resource.maxCpu }}
              memory: {{ $value.resource.maxMemory }}
          {{ with $value.probe }}
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              path: {{ $value.probe.path }}
              port: {{ $value.probe.port }}
              httpHeaders:
                - name: Content-Type
                  value: application/json
          {{ end }}
{{ end }}
