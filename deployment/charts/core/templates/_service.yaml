{{ define "core.service" }}
{{ $port := (index .Values "f7r-core" "port") }}
{{ $value := (index .Values "f7r-core" "commonService") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $value.name | quote }}
  namespace: {{ $value.namespace | quote }}
  labels:
    {{- $value.labels | toYaml | nindent 4 }}
spec:
  selector:
  app: nginx
    ports:
      - targetPort: {{ $port.serverPort }}
        port: {{ $port.exposePort }}
        protocol: {{ $port.protocol }}
{{ end }}