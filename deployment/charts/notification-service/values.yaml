f7r-core:
  commonDeployment:
    name: notification-service
    namespace: f7r-notification-service
    replicas: 8
    labels:
      service: notification-service
    availability:
      minReadySeconds: 10
      maxSurge: 20%
      maxUnavailable: 20%
    resource:
      minCpu: 100m
      minMemory: 256Mi
      maxCpu: 250m
      maxMemory: 512Mi
  commonService:
    name: notification-service
    namespace: f7r-notification-service
    labels:
      adaptor: notification-service
  port:
    serverPort: 3000
    exposePort: 3000
    protocol: TCP