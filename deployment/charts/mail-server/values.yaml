f7r-core:
  commonDeployment:
    name: mail-server
    namespace: f7r-mail-server
    replicas: 20
    labels:
      adaptor: mail-server
    availability:
      minReadySeconds: 10
      maxSurge: 25%
      maxUnavailable: 25%
    resource:
      minCpu: 100m
      minMemory: 256Mi
      maxCpu: 250m
      maxMemory: 512Mi
  commonService:
    name: mail-server
    namespace: f7r-mail-server
    labels:
      adaptor: mail-server
  port:
    serverPort: 3000
    exposePort: 3000
    protocol: TCP