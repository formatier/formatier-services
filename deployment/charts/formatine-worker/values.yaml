f7r-core:
  commonDeployment:
    name: formatine-worker
    namespace: f7r-formatine-worker
    replicas: 20
    labels:
      adaptor: formatine-worker
    availability:
      minReadySeconds: 10
      maxSurge: 25%
      maxUnavailable: 25%
    resource:
      minCpu: 100m
      minMemory: 256Mi
      maxCpu: 250m
      maxMemory: 512Mi
  commonService:
    name: formatine-worker
    namespace: f7r-formatine-worker
    labels:
      adaptor: formatine-worker
  port:
    serverPort: 3000
    exposePort: 3000
    protocol: TCP